[project]
name = "pocket-toolkit"
dynamic = ["version"]
description = "Run your own personal mini apps: a FastAPI host for modules your agent writes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
pocket = "pocket_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pocket_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_toolkit"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pocket_toolkit", "modules"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
