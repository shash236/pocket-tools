<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px 16px; max-width: 720px; margin-inline: auto; }
    form { display: grid; gap: 8px; margin-bottom: 24px; }
    input, textarea, button { font: inherit; padding: 8px; }
    article { padding: 12px 0; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, Canvas); }
    article p { white-space: pre-wrap; margin: 4px 0; }
    article button { font-size: 12px; padding: 2px 8px; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Apps</a></p>
  <h1>Items</h1>
  <form id="new">
    <input name="title" placeholder="Title" required maxlength="200">
    <textarea name="body" rows="3" placeholder="Item"></textarea>
    <button>Add</button>
  </form>
  <div id="list"></div>
  <script>
    // Relative paths: the page lives at /m/items/, so "api/..." is /m/items/api/...
    const list = document.getElementById("list");

    async function load() {
      const items = await (await fetch("api/items")).json();
      list.replaceChildren(...items.map((n) => {
        const el = document.createElement("article");
        el.innerHTML = "<strong></strong><p></p><button>Delete</button>";
        el.querySelector("strong").textContent = n.title;
        el.querySelector("p").textContent = n.body;
        el.querySelector("button").onclick = async () => {
          await fetch(`api/items/${n.id}`, { method: "DELETE" });
          load();
        };
        return el;
      }));
    }

    document.getElementById("new").onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      await fetch("api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      form.reset();
      load();
    };

    load();
  </script>
</body>
</html>
